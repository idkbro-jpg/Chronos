# Chronos permissions (NEW DESIGN)
# Copy to permissions.yml and edit:
#   cp permissions.example.yml permissions.yml
#
# Rules of this system:
#   - Everything is namespaced: chronos:…  bash:…  alias:…
#   - Only Discord user IDs (never names)
#   - File is re-read on every check (no stale RAM state)
#   - No entry = no rights (multiple deny walls)
#   - Broken YAML → Safe-Mode (only the hardcoded super-owner keeps rights)
#   - Writing the file is only allowed for the super-owner ID + anyone with rank owner
#
# After manual edits the next message already sees the change.
# !perm commands (when wired in main.py) also write this file.

# ---------------------------------------------------------------------------
# Super-owner (fallback when YAML is broken or missing)
# This ID always has full rights and can always write the file.
# Put YOUR Discord user ID here (never commit real IDs to a public repo).
# ---------------------------------------------------------------------------
super_owner_id: "YOUR_DISCORD_USER_ID"

# ---------------------------------------------------------------------------
# Presets (ranks)
# permissions = list of namespaced rights
# needs_approval = whether this rank still needs ✅ for actions
# ---------------------------------------------------------------------------
presets:
  helper:
    needs_approval: true
    permissions:
      - chronos:history
      - chronos:screenshot
      - chronos:ping
      - chronos:status
      - chronos:help

  mod:
    needs_approval: true
    permissions:
      - chronos:history
      - chronos:screenshot
      - chronos:lock
      - chronos:input
      - chronos:mouse
      - chronos:exportlog
      - chronos:ping
      - chronos:status
      - chronos:help

  admin:
    needs_approval: true
    permissions:
      - chronos:history
      - chronos:screenshot
      - chronos:lock
      - chronos:unlock
      - chronos:sudomode
      - chronos:input
      - chronos:mouse
      - chronos:luksunlock
      - chronos:exportlog
      - chronos:manage_bot
      - chronos:manage_permissions
      - chronos:reload
      - chronos:sysinfo
      - chronos:ping
      - chronos:status
      - chronos:help

  owner:
    needs_approval: false
    permissions:
      - chronos:*          # all Chronos-built-in commands
      - alias:*            # all aliases
      - bash:*             # unrestricted shell

# ---------------------------------------------------------------------------
# Users (only IDs)
# rank          → takes the preset
# extra         → additional permissions (can grant things the rank does not have)
# deny          → remove permissions the rank would otherwise give
# needs_approval → overrides the rank's default (optional)
# ---------------------------------------------------------------------------
users:
  "YOUR_DISCORD_USER_ID":          # full owner – replace with your real ID locally
    rank: owner
    needs_approval: false

  # Example of a more limited user:
  # "123456789012345678":
  #   rank: mod
  #   extra:
  #     - bash:ls
  #     - bash:uptime
  #     - bash:df*
  #     - chronos:sysinfo
  #   deny:
  #     - chronos:lock          # even though mod has lock, this user cannot use it
  #   needs_approval: true
