# Chronos permissions (TEMPLATE)
# Copy to permissions.yml and edit:
#   cp permissions.example.yml permissions.yml
#
# Only Chronos-specific permissions live here.
# Discord already handles ban / kick / manage channels etc.
#
# After changes: reload with your command_prefix (default !) e.g. !perm reload or !reload
#
# Permission names are either:
#   - special ones listed below (sudo, manage_permissions, …)
#   - any command / alias name (e.g. aegis, screenshot, uptime, cmd, …)
#
# Note: "sudo" (bypass all permission checks) is different from the "sudomode"
# command (temporary no-approval mode unlocked via DM password).

special_permissions:
  sudo: "Bypass every permission check (dangerous)"
  manage_permissions: "Use perm commands and edit this config / user overrides"
  manage_bot: "Reserved for bot management; !reload is gated by this permission"
  lock: "Lock the machine"
  unlock: "Unlock the machine (DM password still required)"
  sudomode: "Enable / view sudomode"
  screenshot: "Take screenshots"
  input: "Keyboard simulation"
  mouse: "Mouse simulation"
  luksunlock: "Unlock configured LUKS volume"
  exportlog: "Export / view logs"
  history: "View command history"

# Discord Role → Chronos rank
# Supports BOTH role name (string) and role ID (string of digits).
# Highest matching rank wins; higher ranks inherit all lower ranks.
role_map:
  # Replace with your real Discord role names or IDs
  "Owner": owner
  # "123456789012345678": owner
  "Admin": admin
  "Moderator": mod
  "Helper": helper

ranks:
  helper:
    level: 30
    permissions:
      - history
      - screenshot

  mod:
    level: 50
    permissions:
      - lock
      - input
      - mouse
      - exportlog
      # - aegis
      # - uptime

  admin:
    level: 80
    permissions:
      - manage_bot
      - manage_permissions
      - sudomode
      - luksunlock
      - unlock

  owner:
    level: 100
    permissions:
      - "*"

# Optional per-user overrides (also filled by !perm give / remove)
# user_overrides:
#   "987654321098765432":
#     extra_permissions:
#       - aegis
#     denied_permissions: []
#     extra_ranks:
#       - mod
