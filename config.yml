# Chronos configuration
# Secrets → .env + secrets/
# After changes: !reload  or  systemctl --user restart chronos-daemon

discord:
  command_prefix: "!"

  # SECURITY: if false, anyone who can post in the command channel can propose
  # shell commands (still needs ✅ approval; if approval.allowed_user_ids is
  # empty, any non-bot can approve).
  # Recommended:
  #   whitelist_enabled: true
  #   allowed_user_ids: [YOUR_DISCORD_USER_ID]
  whitelist_enabled: false
  allowed_user_ids: []

  # Optional: mirror critical events (exec, lock, unlock, luks). 0 = off.
  audit_channel_id: 0

approval:
  timeout_seconds: 60
  approve_emoji: "✅"
  deny_emoji: "❌"
  # Empty = any non-bot user may approve. Restrict in shared servers.
  allowed_user_ids: []

execution:
  timeout_seconds: 300
  use_shell: true
  max_output_chars: 1800
  strip_ansi: true
  # unrestricted = any approved shell command
  # allowlist = only commands matching allowed_patterns
  mode: unrestricted
  # Patterns (full-string unless re:):
  #   plain string → exact match
  #   glob with * or ? → full-string glob
  #   re:REGEX → re.search
  allowed_patterns: []

rate_limit:
  enabled: true
  max_commands: 20
  window_seconds: 60
  trigger_alarm: true

security:
  state_dir: "state"
  lock_hash_file: "secrets/lock.hash"
  # After alarm: block all commands until local clear or DM unlock
  alarm_blocks_all: true

logging:
  enabled: true
  dir: "logs"
  also_log_denied: true

history:
  enabled: true
  max_entries: 30

files:
  aliases: aliases.yml

luks:
  enabled: false
  device: "/dev/sdX"
  mapper_name: "crypt_data"
  password_file: "secrets/luks.enc"
  machine_secret_file: "secrets/machine.key"
  post_unlock_command: ""
