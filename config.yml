# Chronos configuration
# Secrets live in .env + secrets/
# After changes: !reload  or  systemctl --user restart chronos-daemon
#
# Numeric fields: if a value is missing, empty, or not a valid integer,
# Chronos uses the default shown next to each key (daemon does not crash).
# Example: timeout_seconds: sixty  → treated as 60

discord:
  # Bot command prefix in the command channel.
  # Default "!" — do NOT use "?" here: "?" is reserved by the Android Receiver
  # for local commands (?status, ?ping) that run on the phone without Discord.
  command_prefix: "!"

  # SECURITY: if false, anyone who can post in the command channel can propose
  # shell commands (still needs ✅ approval; if approval.allowed_user_ids is
  # empty, any non-bot can approve).
  # Recommended for real use:
  #   whitelist_enabled: true
  #   allowed_user_ids: [YOUR_DISCORD_USER_ID]
  whitelist_enabled: false
  allowed_user_ids: []

  # Optional: mirror critical events (exec, lock, unlock, luks).
  # Default / invalid → 0 (off).
  audit_channel_id: 0

approval:
  # How long to wait for ✅/❌. Default / invalid → 60
  timeout_seconds: 60
  approve_emoji: "✅"
  deny_emoji: "❌"
  # Empty = any non-bot user may approve. Restrict in shared servers.
  # Example: allowed_user_ids: [YOUR_DISCORD_USER_ID]
  # Invalid IDs in the list are skipped (not a crash).
  allowed_user_ids: []

execution:
  # Max runtime for a shell command. Default / invalid → 300
  timeout_seconds: 300
  use_shell: true
  # Max chars per stdout/stderr Discord reply chunk. Default / invalid → 1800
  max_output_chars: 1800
  # Max Discord messages per stream (stdout and stderr separately).
  # Default / invalid / ≤0 → 6. Prevents a huge command from flooding the channel.
  max_output_chunks: 6
  strip_ansi: true
  # unrestricted = any approved shell command
  # allowlist   = only commands matching allowed_patterns
  mode: unrestricted
  # Patterns (full-string unless re:):
  #   plain string  → exact match only
  #   glob with * ? → full-string glob
  #   re:REGEX      → re.search
  # There is NO loose substring match (e.g. "uptime" does not allow "rm; uptime").
  allowed_patterns: []

rate_limit:
  enabled: true
  # Max commands per user per window. Default / invalid → 20
  max_commands: 20
  # Window length in seconds. Default / invalid → 60
  window_seconds: 60
  trigger_alarm: true

security:
  state_dir: "state"
  lock_hash_file: "secrets/lock.hash"
  # After alarm: block all commands until local clear or DM unlock
  alarm_blocks_all: true

logging:
  enabled: true
  dir: "logs"
  also_log_denied: true

history:
  enabled: true
  # Max entries kept in state/history.json. Default / invalid → 30
  max_entries: 30

files:
  aliases: aliases.yml

luks:
  enabled: false
  device: "/dev/sdX"
  mapper_name: "crypt_data"
  password_file: "secrets/luks.enc"
  machine_secret_file: "secrets/machine.key"
  post_unlock_command: ""
