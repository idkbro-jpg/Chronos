# ============================================================
# Chronos – zentrale Konfiguration
# Secrets (Token) bleiben in .env
# Nach Änderungen: !reload  ODER  systemctl --user restart chronos-daemon
# ============================================================

discord:
  command_prefix: "!"
  allowed_user_ids: []

approval:
  timeout_seconds: 60
  approve_emoji: "✅"
  deny_emoji: "❌"
  allowed_user_ids: []

execution:
  timeout_seconds: 300
  use_shell: true
  max_output_chars: 1800
  strip_ansi: true

files:
  aliases: aliases.yml

# ------------------------------------------------------------
# LUKS unlock (nach normalem Boot, wenn Chronos schon läuft)
# Setup:  python -m scripts.set_luks_password
# Nutzung: !luksunlock
# ------------------------------------------------------------
luks:
  enabled: false

  # Block device ODER vorhandener Mapper-Name je nach Situation
  # Beispiel: /dev/nvme0n1p3  oder  /dev/disk/by-uuid/....
  device: "/dev/sdX"

  # Name unter /dev/mapper/<name> nach dem Unlock
  mapper_name: "crypt_data"

  # Verschlüsselte Passwortdatei (nie ins Git)
  password_file: "secrets/luks.enc"

  # Lokales Extra-Secret (wird beim Setup erzeugt, nie ins Git)
  machine_secret_file: "secrets/machine.key"

  # Optional: Befehl nach erfolgreichem Unlock (z.B. Mount)
  # Leer = nur luksOpen
  post_unlock_command: ""
  # Beispiel:
  # post_unlock_command: "mount /dev/mapper/crypt_data /mnt/data"
